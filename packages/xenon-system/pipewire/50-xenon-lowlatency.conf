# Xenon audio: low latency by default for games and music production
# (Ableton Live, DAWs, USB audio interfaces), while still allowing larger
# buffers for apps that ask for them to save power.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}
