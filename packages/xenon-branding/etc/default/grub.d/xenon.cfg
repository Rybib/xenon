# Xenon boot menu defaults (sourced by /etc/default/grub).
GRUB_DISTRIBUTOR="Xenon"
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_BACKGROUND="/usr/share/xenon/grub.png"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="white/blue"
# quiet splash: Plymouth boot splash. preempt=full: lower input and audio
# latency for games and music production. Debian's kernel is built with
# PREEMPT_DYNAMIC, so this is a boot option rather than a custom kernel.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:-quiet splash} preempt=full"
# Show Windows and other installed systems in the boot menu (dual boot).
GRUB_DISABLE_OS_PROBER=false
