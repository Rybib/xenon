---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Must stay "debian": Debian's Secure Boot-signed GRUB looks for its
# configuration in EFI/debian. The boot menu entry is still titled Xenon.
efiBootloaderId: "debian"
# The removable-media fallback (EFI/BOOT/BOOTX64.EFI) is written with shim
# by shellprocess@final, so it also works with Secure Boot.
installEFIFallback: false
