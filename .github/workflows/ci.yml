name: CI

on:
  push:
  pull_request:

jobs:
  xws:
    name: Windows subsystem (unit + end-to-end with Wine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine, mingw-w64 and test tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386 \
            mingw-w64 xvfb xauth python3-pytest desktop-file-utils make
      - name: Unit tests
        run: python3 -m pytest -q packages/xenon-xws/tests packages/xenon-settings/tests
      - name: End-to-end (install, app grid, launch, uninstall)
        run: packages/xenon-xws/tests/e2e.sh "$RUNNER_TEMP/e2e"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils
          shellcheck build-iso.sh tools/*.sh kernel/build-kernel.sh \
            packages/xenon-xws/tests/e2e.sh packages/xenon-system/vm-selftest \
            packages/xenon-xws/data/xws-binfmt packages/xenon-installer/scripts/* \
            live/auto/*
          (cd packages/xenon-xws-thirdparty && shellcheck -x fetch.sh)
          shellcheck -s sh live/config/hooks/normal/*.hook.chroot
      - name: Desktop entries
        run: |
          for f in packages/*/data/*.desktop packages/xenon-installer/live/*.desktop; do
            desktop-file-validate "$f"
          done
      - name: Python syntax
        run: python3 -m compileall -q packages/xenon-xws/xws packages/xenon-settings/xenon_settings

  packages:
    name: Debian packages (trixie)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper dh-python python3 \
            python3-pytest librsvg2-bin dpkg-dev fakeroot curl zstd ca-certificates \
            lintian
      - name: Build packages
        run: tools/build-packages.sh "$PWD/out/debs"
      - name: Lintian
        run: lintian --tag-display-limit 0 --suppress-tags package-installs-apt-preferences,no-manual-page,maintainer-script-calls-systemctl,appstream-metadata-missing-modalias-provide out/debs/*.deb
      - name: Check GNOME settings overrides against the real schemas
        run: |
          apt-get install -y --no-install-recommends gnome-shell gnome-settings-daemon \
            gnome-shell-extension-dashtodock gnome-shell-extension-appindicator \
            gsettings-desktop-schemas mutter-common gnome-software libglib2.0-bin
          mkdir -p /tmp/schemas
          cp /usr/share/glib-2.0/schemas/*.xml /tmp/schemas/
          cp packages/xenon-system/schemas/*.override packages/xenon-installer/live/*.override /tmp/schemas/
          glib-compile-schemas --strict --dry-run /tmp/schemas
      - uses: actions/upload-artifact@v4
        with:
          name: xenon-debs
          path: out/debs/*.deb
