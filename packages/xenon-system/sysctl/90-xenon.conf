# Xenon system tuning.

# Many modern games (and some Windows apps under Wine) create more memory
# mappings than the default 65530 allows and crash without this.
# Same value as Fedora, Arch and SteamOS.
vm.max_map_count = 2147483642

# Don't slow down programs that do split locks (common in older games)
# with the kernel's deliberate penalty; log them instead.
kernel.split_lock_mitigate = 0

# Swap goes to compressed RAM (zram) first, which is far faster than disk.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Developer tools and file sync clients watch many files.
fs.inotify.max_user_watches = 524288
