# Xenon installer (Calamares) configuration.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id:       nvidia
  module:   packagechooser
  config:   packagechooser_nvidia.conf
- id:       nvidia
  module:   contextualprocess
  config:   contextualprocess_nvidia.conf
- id:       target
  module:   shellprocess
  config:   shellprocess_target.conf
- id:       final
  module:   shellprocess
  config:   shellprocess_final.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@nvidia
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@target
  - contextualprocess@nvidia
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@final
  - umount
- show:
  - finished

branding: xenon
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
